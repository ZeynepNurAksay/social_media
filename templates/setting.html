{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'assets/images/favicon.png' %}" rel="icon" type="image/png">
    <title>Settings</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/uikit.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/tailwind.css' %}">

</head>

<body>  

            <div class="container mx-auto px-4">
  <h1 class="mt-3 text-center text-2xl text-gray-900">
    Account Settings
  </h1>

  <div class="mx-auto mt-12 w-full max-w-4xl">
    <form action="" method="post" enctype="multipart/form-data"
          class="w-full rounded-md bg-white shadow-lg">
      {% csrf_token %}

      <div class="grid grid-cols-2 gap-3 p-4 lg:p-6">
        <a href="/" class="back-home col-span-2 justify-self-start">
          <span aria-hidden="true">←</span>
          Back to home
        </a>

        <div class="col-span-2">
          <label for="username">Username</label>
          <input id="username" type="text" name="username"
                 value="{{ user.username }}"
                 class="w-full bg-gray-100 shadow-none">
        </div>

        <div class="col-span-2">
          <label for="email">Email</label>
          <input id="email" type="email" name="email"
                 value="{{ user.email }}"
                 class="w-full bg-gray-100 shadow-none">
        </div>

        <div class="col-span-2">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Your bio"
                    class="w-full bg-gray-100 shadow-none">{{profile.bio}}</textarea>
        </div>

        <div class="col-span-2">
          <label for="location">Location</label>
          <input id="location" type="text" name="location" value="{{profile.location}}"
                 placeholder="Your location"
                 class="w-full bg-gray-100 shadow-none">
        </div>

        <div class="col-span-2">
          <label for="website">Website</label>
          <input id="website" type="url" name="website"
                 placeholder="https://example.com"
                 value="{{profile.website}}"
                 class="w-full bg-gray-100 shadow-none">
        </div>

        <div class="col-span-2">
          <label for="avatar">Avatar</label>
          <img src="{{profile.avatar.url}}" width="96" height="96" alt="">
          <input id="avatar" type="file" name="avatar" accept="image/*"
                 class="w-full bg-gray-100 shadow-none">
        </div>
      </div>

      <div class="flex justify-end gap-3 p-6 pt-0">
        <a href="/" class="rounded bg-gray-50 px-4 py-2 text-red-500">
          Cancel
        </a>
        <button type="submit" class="button bg-blue-700">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
            
        </div>

    </div>


    

 <!-- Scripts
    ================================================== -->
    <script src="{% static 'assets/js/tippy.all.min.js' %}"></script>  
    <script src="{% static 'assets/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'assets/js/uikit.js' %}"></script>
    <script src="{% static 'assets/js/simplebar.js' %}"></script>
    <script src="{% static 'assets/js/custom.js' %}"></script>


    <script src="{% static '../../unpkg.com/ionicons%405.2.3/dist/ionicons.js' %}"></script>
</body>

</html>
